name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      # The differential tests run the system git and compare against it, so
      # the runner needs a git the tests can call.
      - run: git --version
      - uses: wow-look-at-my/go-toolchain@v1
